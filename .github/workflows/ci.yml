name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  whitespace-and-lint:
    name: Whitespace & Style Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      # PR: the checked-out merge commit's first parent is the base tip
      # (origin/<base> is never fetched). Push: diff the whole push against
      # the previous tip, and let findings fail the job.
      - name: Check for trailing whitespace and merge artifacts
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check HEAD^1 HEAD
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE"
            git diff --check "$BEFORE" HEAD
          else
            git diff --check "$(git hash-object -t tree /dev/null)" HEAD
          fi

  test-javascript:
    name: Node.js Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run JavaScript tests
        run: npm test

  test-python:
    name: Python SITL Bridge & Mock Test Suites
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sitl/requirements.txt

      - name: Run Bridge test suite
        run: python -B sitl/test_bridge.py

      - name: Run Executable Mock test suite
        run: python -B sitl/test_mock_vehicles.py

      - name: Run Protocol Conformance test suite
        run: python -B sitl/test_protocol_conformance.py

      - name: Run Automated Failure Scenarios test suite
        run: python -B sitl/test_failure_scenarios.py

      - name: Run end-to-end acceptance against the executable mock
        run: python -B sitl/run_acceptance.py --mode mock --report /tmp/acceptance_mock.json
