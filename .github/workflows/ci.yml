name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  whitespace-and-lint:
    name: Whitespace & Style Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for trailing whitespace and merge artifacts
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check origin/${{ github.base_ref }}...HEAD
          else
            git diff --check HEAD~1...HEAD || true
          fi

  test-javascript:
    name: Node.js Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run JavaScript tests
        run: node --test

  test-python:
    name: Python SITL Bridge & Mock Test Suites
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sitl/requirements.txt

      - name: Run Bridge test suite
        run: python -B sitl/test_bridge.py

      - name: Run Executable Mock test suite
        run: python -B sitl/test_mock_vehicles.py

      - name: Run Protocol Conformance test suite
        run: python -B sitl/test_protocol_conformance.py

      - name: Run Automated Failure Scenarios test suite
        run: python -B sitl/test_failure_scenarios.py
