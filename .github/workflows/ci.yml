name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Every job only reads the repository.
permissions:
  contents: read

jobs:
  whitespace-and-lint:
    name: Whitespace & Style Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      # PR: the checked-out merge commit's first parent is the base tip
      # (origin/<base> is never fetched). Push: diff the whole push against
      # the previous tip, and let findings fail the job.
      - name: Check for trailing whitespace and merge artifacts
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check HEAD^1 HEAD
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE"
            git diff --check "$BEFORE" HEAD
          else
            git diff --check "$(git hash-object -t tree /dev/null)" HEAD
          fi

  test-javascript:
    name: Node.js Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run JavaScript tests
        run: npm test

  test-python:
    name: Python SITL Bridge & Mock Test Suites
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sitl/requirements.txt

      - name: Run Bridge test suite
        run: python -B sitl/test_bridge.py

      - name: Run Executable Mock test suite
        run: python -B sitl/test_mock_vehicles.py

      - name: Run Protocol Conformance test suite
        run: python -B sitl/test_protocol_conformance.py

      - name: Run Automated Failure Scenarios test suite
        run: python -B sitl/test_failure_scenarios.py

      - name: Run TAK bridge test suite
        run: python -B sitl/test_tak_bridge.py

      - name: Run end-to-end acceptance against the executable mock
        run: python -B sitl/run_acceptance.py --mode mock --report "$RUNNER_TEMP/acceptance_mock.json" --logs-dir "$RUNNER_TEMP/acceptance-logs"

      - name: Upload acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: acceptance-diagnostics-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/acceptance_mock.json
            ${{ runner.temp }}/acceptance-logs/
          if-no-files-found: ignore

  # The live demo deploys only a main push that passed every job above. It
  # stays inert while the repository's Pages source is "Deploy from a branch"
  # (that builder runs alongside CI, ungated); switching Settings > Pages >
  # Source to "GitHub Actions" turns this gate on, with no further edit.
  pages-source:
    name: Read the GitHub Pages source
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      build_type: ${{ steps.read.outputs.build_type }}
    steps:
      - name: Read the Pages build type (workflow = GitHub Actions)
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Any API failure (Pages off, no access) reads as "none": skip, never fail.
          type="$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null)" || type=none
          case "$type" in workflow|legacy) ;; *) type=none ;; esac
          echo "build_type=$type" >> "$GITHUB_OUTPUT"
          if [ "$type" != workflow ]; then
            echo "::notice::Pages source is '$type', not GitHub Actions: the tested deploy is skipped."
          fi

  deploy-pages:
    name: Deploy live demo to GitHub Pages
    needs: [whitespace-and-lint, test-javascript, test-python, pages-source]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.pages-source.outputs.build_type == 'workflow'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Package the static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
