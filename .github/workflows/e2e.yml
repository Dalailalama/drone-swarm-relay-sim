name: Browser E2E (opt-in)

# The Playwright browser <-> mock test needs a Chromium download, so it is not
# part of ci.yml: start it by hand from the Actions tab (Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-mock-e2e:
    name: Browser <-> mock end to end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Playwright, its Chromium and websockets
        run: |
          python -m pip install --upgrade pip
          pip install -r test/requirements-e2e.txt
          python -m playwright install --with-deps chromium

      - name: Run the browser <-> mock integration test
        run: python -B test/test_integration_mock.py

      - name: Upload Playwright trace and screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-test-results
          path: test-results/
          if-no-files-found: ignore
